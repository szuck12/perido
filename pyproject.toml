[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perido"
description = "Perido — a local-first command-line Pomodoro timer with a focus journey."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam Zuckerman" }]
keywords = ["perido", "pomodoro", "timer", "focus", "cli", "productivity"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/szuck12/perido"
Repository = "https://github.com/szuck12/perido"
Changelog = "https://github.com/szuck12/perido/blob/main/CHANGELOG.md"

[project.scripts]
perido = "perido.cli:main"

[tool.setuptools.packages.find]
include = ["perido*"]

[tool.setuptools.dynamic]
version = { attr = "perido.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
