name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements.txt
          # Pinned so lint and audit results are deterministic.
          python -m pip install ruff==0.16.5 pip-audit==2.10.1
      - name: Lint
        run: ruff check perido tests
      - name: Test
        run: python -m pytest
      - name: Audit dependencies
        run: pip-audit